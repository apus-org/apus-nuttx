name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apus-nuttx
          persist-credentials: false

      - name: Checkout NuttX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apache/nuttx
          path: nuttx
          persist-credentials: false

      - name: Checkout NuttX apps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apache/nuttx-apps
          path: apps
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi kconfig-frontends-nox

      - name: Check style
        working-directory: apus-nuttx
        run: |
          gcc -o "$RUNNER_TEMP/nxstyle" ../nuttx/tools/nxstyle.c
          find boards -name '*.[ch]' -print0 | xargs -0 -n 1 "$RUNNER_TEMP/nxstyle"

      - name: Build configurations
        working-directory: nuttx
        run: |
          for config in ../apus-nuttx/boards/apus/configs/*; do
            echo "::group::$(basename "$config")"
            ./tools/configure.sh -l "$config"
            make -j"$(nproc)" EXTRAFLAGS="-Wno-cpp -Werror"
            make savedefconfig
            diff -u "$config/defconfig" defconfig
            make distclean
            echo "::endgroup::"
          done
